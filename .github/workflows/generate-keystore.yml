name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          mkdir -p /tmp/keys
          keytool -genkeypair -v \
            -keystore /tmp/keys/release.keystore \
            -storepass gops2026key \
            -keypass gops2026key \
            -alias gops \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ground OPS Tracker,OU=Mobile,O=Ground OPS,L=Cairo,C=EG"
      
      - name: Show base64 (COPY THIS)
        run: |
          echo ""
          echo "============= COPY THE LINE BELOW ============="
          base64 -w 0 /tmp/keys/release.keystore
          echo ""
          echo "============= END ============="
          echo ""
          echo "Keystore password: gops2026key"
          echo "Key alias: gops"
          echo "Key password: gops2026key"
