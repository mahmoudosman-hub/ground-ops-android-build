name: Build Android APK

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Preflight - check project files
        run: |
          set -euo pipefail
          echo "Project files OK"
          test -f package.json
          test -f capacitor.config.json
          test -d android
          test -d frontend
          node --version
          java -version

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build web/PWA
        run: node tools/build-pwa.js || true

      - name: Capacitor sync
        run: npx cap sync android

      # ============ STABLE DEBUG KEYSTORE ============
      # Cache the debug keystore so every build uses the same signature.
      - name: Cache debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gops-debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating a fresh debug keystore..."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already cached."
          fi
          ls -la ~/.android/
      # ================================================

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ground-ops-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
