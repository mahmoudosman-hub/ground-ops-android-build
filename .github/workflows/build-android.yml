name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Preflight - check project files
        run: |
          set -euo pipefail
          echo "Project files OK"
          test -f package.json
          test -f capacitor.config.json
          test -d android
          test -d frontend
          node --version
          java -version

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build web/PWA
        run: node tools/build-pwa.js || true

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode release keystore
        run: |
          mkdir -p ~/release
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/release/release.keystore
          ls -la ~/release/

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$HOME/release/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/ground-ops-tracker-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ground-ops-tracker-release-apk
          path: android/app/build/outputs/apk/release/ground-ops-tracker-release.apk
